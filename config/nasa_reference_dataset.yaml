  - {id: REF-STD-V1-4002, group: requirement, label: "Surface EVA aerobic capacity (VO2max)", value: 36.5, unit: "ml/(kg·min), at or above", value_type: STANDARD_REQUIREMENT, requirement: "NASA-STD-3001 V1 4002, as quoted in OCHMO-TB-031", source: OCHMO-TB-031}
  - {id: REF-STD-V1-4003, group: requirement, label: "In-mission aerobic capacity", value: 80, unit: "% of pre-mission, at or above", value_type: STANDARD_REQUIREMENT, requirement: "NASA-STD-3001 V1 4003, as quoted in OCHMO-TB-031", source: OCHMO-TB-031}
  - {id: REF-STD-V1-4024, group: requirement, label: "In-mission skeletal muscle strength", value: 80, unit: "% of baseline, at or above", value_type: STANDARD_REQUIREMENT, requirement: "NASA-STD-3001 V1 4024, as quoted in OCHMO-TB-031", source: OCHMO-TB-031}
  - {id: REF-STD-V1-4027, group: requirement, label: "In-mission BMD: hip and spine / femoral neck", value: [95, 90], unit: "% of pre-mission, at or above", value_type: STANDARD_REQUIREMENT, requirement: "NASA-STD-3001 V1 4027, as quoted in OCHMO-TB-031", source: OCHMO-TB-031}
  - {id: REF-VO2-INFLIGHT, group: exercise, label: "In-flight VO2max change, long-duration (average and range)", value: [-7.4, -2.35, -11.21], unit: "%", value_type: OBSERVED_STATISTIC, statistic: "average, range as reported", source: OCHMO-TB-031}
  - {id: REF-SLEEP-INFLIGHT, group: sleep, label: "Average nightly sleep, Shuttle and ISS (Barger et al. 2014)", value: [6.0, 6.5], unit: "h (approx.)", value_type: OBSERVED_STATISTIC, statistic: "approximate average as summarized", source: OCHMO-TB-041}
  - {id: REF-SLEEP-R7, group: sleep, label: "Sleep duration 7 days after landing (Barger et al. 2014)", value: 7, unit: "h (approx.)", value_type: OBSERVED_STATISTIC, statistic: "approximate as summarized", source: OCHMO-TB-041}
